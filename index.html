body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 460px at 12% 6%,rgba(245,134,52,.24),transparent 65%),radial-gradient(780px 620px at 94% 16%,rgba(36,82,55,.95),transparent 65%),radial-gradient(720px 540px at 55% 105%,rgba(36,82,55,.7),transparent 65%)}
:root[data-theme="light"] body::before{background:radial-gradient(600px 460px at 10% 6%,rgba(245,134,52,.28),transparent 65%),radial-gradient(780px 620px at 94% 16%,rgba(36,82,55,.3),transparent 65%),radial-gradient(720px 540px at 55% 105%,rgba(36,82,55,.22),transparent 65%)}
@layer base{h2{@apply text-2xl font-bold}h3{@apply mb-2 text-xl font-bold}main p,#mb p{@apply mb-3 mt-1}}
@layer components{
.glass{@apply bg-glass backdrop-blur-2xl border border-bd shadow-[inset_0_1px_0_rgba(255,255,255,.12),0_10px_40px_rgba(0,0,0,.22)]}
.card{@apply glass rounded-2xl p-4 mb-4 sm:p-5}
.nv{@apply flex w-full cursor-pointer items-center gap-3 rounded-xl border-0 bg-transparent px-3 py-2.5 text-left text-[15px] text-mu transition hover:bg-c2 hover:text-tx}
.nv.on{background:rgba(245,134,52,.16);color:var(--tx);font-weight:600;box-shadow:inset 3px 0 0 var(--ac)}.nv.on svg{color:var(--ac)}
.logo{@apply h-10 w-10 shrink-0 rounded-xl;background:linear-gradient(135deg,var(--ac),#245237);box-shadow:0 0 22px rgba(245,134,52,.45),inset 0 1px 0 rgba(255,255,255,.4)}
.btn{@apply inline-flex cursor-pointer items-center justify-center gap-2 rounded-xl border-0 px-4 py-2 font-bold text-[#1b1208] transition hover:-translate-y-px hover:brightness-110;background-image:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 6px 20px rgba(245,134,52,.28)}
.btn.g{@apply border border-bd bg-c2 font-medium text-tx shadow-none backdrop-blur-md;background-image:none}.btn.g:hover{border-color:rgba(245,134,52,.55)}
.btn.d{@apply border border-bd bg-transparent font-medium shadow-none;background-image:none;color:var(--bad)}
.btn.s{@apply px-3 py-1 text-[13px]}
}
.grid{display:grid;gap:.75rem;margin-bottom:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.grid .card{margin:0;transition:.2s}.grid .card:hover{border-color:rgba(245,134,52,.5);transform:translateY(-2px)}
.k{color:var(--mu);font-size:13px}.v{font-size:1.75rem;font-weight:700;margin-top:2px}
.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:28px;margin-bottom:20px;border:1px solid var(--bd);border-radius:24px;background:linear-gradient(135deg,rgba(36,82,55,.9),rgba(36,82,55,.38));color:#fff;backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 16px 50px rgba(0,0,0,.25)}
.hero::after{content:"";position:absolute;right:-70px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(245,134,52,.6),transparent 70%)}
.hero>*{position:relative;z-index:1}.hero h1{margin:4px 0 2px;font-size:2.1rem;line-height:1.1;font-weight:700;letter-spacing:-.5px}.hero .k,.hero .mu{color:rgba(255,255,255,.8)}.hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.tw{overflow-x:auto}table{width:100%}th,td{padding:11px 8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:13px}tr:hover td{background:var(--c2)}
.r{text-align:right}
input,select,textarea{font:inherit;color:var(--tx);background:var(--c2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%;backdrop-filter:blur(8px)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(245,134,52,.2)}
option{color:#10231a;background:#fff}
button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;margin-bottom:12px}
a.btn{text-decoration:none;display:inline-flex}
.bar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.tag{padding:2px 10px;border-radius:99px;font-size:12px;border:1px solid currentColor}
.paid{color:var(--ok)}.partial{color:var(--wn)}.unpaid{color:var(--bad)}
.ln{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,110px),1fr));gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--bd)}.ln .c1,.ln .c2{grid-column:span 2}.ln .btn{height:40px}
#modal{position:fixed;inset:0;background:rgba(2,8,5,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px;z-index:50}
#modal.open{display:flex}#mb{background:var(--pop);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--bd);border-radius:24px;padding:24px;width:100%;max-width:900px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 30px 80px rgba(0,0,0,.45)}
.tot{margin-left:auto;max-width:300px}.tot div{display:flex;justify-content:space-between;padding:3px 0}
.mu{color:var(--mu)}#note{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;display:none;z-index:70;font-weight:500;max-width:90vw;text-align:center}
#side{overflow:hidden}
@media(max-width:1023px){#side{transform:translateX(-100%)}body.menu #side{transform:none!important}body.menu #scrim{display:block}}
@media(max-width:640px){input,select,textarea{font-size:16px}.hero{padding:20px}.hero h1{font-size:1.6rem}#modal{padding:10px}#mb{padding:16px;border-radius:18px}.v{font-size:1.5rem}}
#auth{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto;background:radial-gradient(700px 480px at 82% 0%,rgba(245,134,52,.30),transparent 60%),radial-gradient(900px 620px at 8% 100%,#245237,transparent 62%),#0b1a11}
#auth::before,#auth::after{content:"";position:absolute;border:1px solid rgba(255,255,255,.12);border-radius:50%;pointer-events:none}
#auth::before{width:900px;height:900px;left:-320px;bottom:-660px}#auth::after{width:1200px;height:1200px;right:-520px;top:-780px}
body.locked #auth{display:flex}body.locked #shell{display:none}
.acard{position:relative;width:100%;max-width:390px;background:linear-gradient(180deg,#e4f3ea,#fff 46%);color:#14231a;border-radius:26px;padding:34px 30px 26px;box-shadow:0 30px 80px rgba(0,0,0,.5);text-align:center}
.aic{width:58px;height:58px;margin:0 auto 18px;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(36,82,55,.28);display:grid;place-items:center;color:#245237}
.acard h2{margin:0 0 6px;font-size:24px;letter-spacing:-.3px}.acard p{margin:0 0 22px;color:#5a6f62;font-size:14.5px}
.afield{position:relative;margin-bottom:12px;text-align:left}
.afield>svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#7f9086}
.afield input{background:#eef2ef;border:1px solid transparent;color:#14231a;padding:13px 42px 13px 42px;border-radius:12px;font-size:15px}
.afield input:focus{border-color:#F58634;background:#fff;box-shadow:0 0 0 3px rgba(245,134,52,.22)}
.afield .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:#7f9086;cursor:pointer;padding:8px;line-height:0}
.alink{background:none;border:0;color:#14231a;font:inherit;font-size:13.5px;cursor:pointer;text-decoration:underline;padding:0}
.abtn{width:100%;margin-top:6px;background:#245237;color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:600;font-size:15.5px;cursor:pointer;transition:.15s}
.abtn:hover{background:#1b4029;box-shadow:0 8px 22px rgba(36,82,55,.4)}.abtn:focus-visible{outline:3px solid #F58634;outline-offset:2px}
.aerr{color:#b42318;font-size:13.5px;min-height:20px;margin:4px 0 2px;text-align:left}
.asep{display:flex;align-items:center;gap:10px;color:#6f7f76;font-size:12.5px;margin:20px 0 12px}.asep::before,.asep::after{content:"";flex:1;border-top:2px dotted #cbd6cf}
.asoc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.asoc button{background:#fff;color:#14231a;border:1px solid #e0e8e3;border-radius:12px;padding:10px 4px;cursor:pointer;font:inherit;font-size:13px}
.acode{font:700 22px/1.2 ui-monospace,Consolas,monospace;letter-spacing:2px;background:#eef2ef;border:2px dashed #245237;border-radius:12px;padding:16px;margin:4px 0 8px;word-break:break-all}
.amini{margin:14px 0 0!important;font-size:12.5px!important;color:#6f7f76!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

async function authGo(){const m=au.mode,err=t=>{au.err=t;$('#au-err').textContent=t},v=id=>($('#'+id)?.value||'').trim();

  const u=users().find(x=>x.email===em);if(!u||(await hashPw(pw,u.salt))!==u.hash){if(++fails>=5){lockUntil=Date.now()+30000;fails=0}return err('Wrong email or password.')}fails=0;return startSession(u)}

 if(m==='forgot'){const us=users(),u=us.find(x=>x.email===em),c=v('au-c').replace(/[^A-Za-z0-9]/g,'').toUpperCase();if(!u||(await hashPw(c,u.rsalt))!==u.rhash)return err('Email or recovery code is not correct.');
  const{u:n,code}=await mkUser(em,pw,u.role);saveUsers(us.map(x=>x.email===em?n:x));return showAuth('code',{code,user:n})}}
