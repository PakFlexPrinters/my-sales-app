<style type="text/tailwindcss">
:root{--bg:#06100b;--pop:rgba(14,28,20,.92);--glass:rgba(36,82,55,.34);--c2:rgba(255,255,255,.08);--tx:#eaf5ee;--mu:#9bb3a6;--bd:rgba(255,255,255,.14);--ac:#F58634;--ac2:#ffa75e;--ok:#5fe39a;--bad:#ff7b8f;--wn:#fbbf24;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

}

<div id="shell" class="flex min-h-screen">

<aside id="side" class="glass fixed inset-y-0 left-0 z-40 flex w-72 max-w-[86vw] flex-col gap-5 p-4 transition-transform duration-300 lg:sticky lg:top-3 lg:m-3 lg:h-[calc(100vh-1.5rem)] lg:translate-x-0 lg:rounded-3xl">
<div class="flex items-center gap-3 px-2 pt-1"><span class="logo"></span><div class="min-w-0"><b id="bn" class="block truncate text-[17px] leading-tight">Office Billing</b><span class="text-xs text-mu">Billing desk</span></div></div>
<nav id="nav" class="flex flex-col gap-1 overflow-y-auto"></nav>

<button class="nv" data-act="theme"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg><span>Dark / light</span></button></div>
</aside>
<div class="min-w-0 flex-1">
<div class="glass sticky top-2 z-20 mx-2 mt-2 flex items-center gap-3 rounded-2xl px-3 py-2.5 lg:hidden"><button class="btn g s" data-act="menu" aria-label="Open menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><b id="bn2" class="min-w-0 flex-1 truncate">Office Billing</b><button class="btn s" data-act="newinv">+ Invoice</button></div>
<main id="main" class="mx-auto w-full max-w-6xl p-4 pb-16 sm:p-6 lg:p-8"></main></div></div><div id="auth"></div><div id="modal"><div id="mb"></div></div><div id="note"></div>
<script>
const S={customers:[],items:[],invoices:[],entries:[],payments:[],biz:{name:'Your Office Name',address:'',phone:'',terms:'Thank you for your business.'}};
let db=null,view='dashboard',draft=null,q='',lc='',lf='',lt='',pf='all',day=new Date().toISOString().slice(0,10);
let rp={from:day.slice(0,8)+'01',to:day};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'Rs. '+(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
function note(t){const n=$('#note');n.textContent=t;n.style.display='block';setTimeout(()=>n.style.display='none',2500)}
// ---- storage: this computer (works offline) + automatic backup to a folder
const KEYS=['customers','items','invoices','entries','payments'];
function loadLocal(){try{const d=JSON.parse(localStorage.getItem('ob')||'null');if(d)Object.assign(S,d)}catch(e){}}
function saveLocal(){try{localStorage.setItem('ob',JSON.stringify(S))}catch(e){note('Could not save. Browser storage is full or blocked.')}scheduleBackup()}
async function put(col,o){const i=S[col].findIndex(x=>x.id===o.id);i<0?S[col].push(o):S[col][i]=o;if(db){try{await db.collection(col).doc(o.id).set(o)}catch(e){note('Could not save: '+(e.message||e.code))}}else saveLocal();render()}
async function del(col,id){S[col]=S[col].filter(x=>x.id!==id);if(db){try{await db.collection(col).doc(id).delete()}catch(e){note('Could not delete')}}else saveLocal();render()}
async function putBiz(){if(db){try{await db.doc('settings/biz').set(S.biz)}catch(e){note('Could not save')}}else saveLocal();render()}
async function initDb(){try{db=window.claude?await claude.use('db'):null}catch(e){db=null}
 if(!db){updBk();return}
 const idle=()=>!$('#modal').classList.contains('open');
 for(const c of KEYS)db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>d.data());if(idle())render()});
 db.doc('settings/biz').onSnapshot(s=>{if(s.exists)Object.assign(S.biz,s.data());if(idle())render()});updBk()}
async function saveBlob(b,name){let d=null;try{d=window.claude?await claude.use('downloads'):null}catch(e){}
 if(d){try{await d.save({filename:name,data:b});note('Saved')}catch(e){note('Download cancelled')}return}
 const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('ob-meta',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvGet=async k=>{const d=await idb();return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})};
const kvSet=async(k,v)=>{const d=await idb();return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r()})};
let dirH=null,bt=null;
async function okPerm(ask){if(!dirH)return false;try{if(await dirH.queryPermission({mode:'readwrite'})==='granted')return true;return !!ask&&await dirH.requestPermission({mode:'readwrite'})==='granted'}catch(e){return false}}
async function writeBackup(ask){if(!dirH||!(await okPerm(ask)))return false;
 const json=JSON.stringify({app:'office-billing',saved:new Date().toISOString(),data:S},null,1);
 try{for(const n of ['office-billing-latest.json','office-billing-'+today()+'.json']){const f=await dirH.getFileHandle(n,{create:true}),w=await f.createWritable();await w.write(json);await w.close()}localStorage.setItem('ob-last',new Date().toLocaleString());updBk();return true}catch(e){return false}}
function scheduleBackup(){clearTimeout(bt);bt=setTimeout(()=>writeBackup(false),3000)}
async function updBk(){const e=$('#sync');if(!e)return;if(db){e.textContent='Live, shared with your office';return}const ok=dirH&&await okPerm(false),l=localStorage.getItem('ob-last');
 e.innerHTML=!dirH?'<a data-act="nav" data-v="settings" style="cursor:pointer;color:var(--wn)">No backup folder set. Click to set one.</a>':ok?'Last backup: '+esc(l||'not yet'):'<a data-act="bkperm" style="cursor:pointer;color:var(--wn)">Click to allow backups again</a>'}
async function initBackup(){try{navigator.storage?.persist?.()}catch(e){}try{dirH=await kvGet('dir')||null}catch(e){}updBk()}
async function pickFolder(){if(!window.showDirectoryPicker)return note('Folder backup needs Microsoft Edge or Google Chrome. Use Download backup file instead.');try{dirH=await showDirectoryPicker({mode:'readwrite',id:'ob-backup'});await kvSet('dir',dirH);note(await writeBackup(true)?'Backup folder set. First backup saved.':'Could not write to that folder. Pick a normal folder, not a drive root.')}catch(e){}}
function dlBackup(){saveBlob(new Blob([JSON.stringify({app:'office-billing',saved:new Date().toISOString(),data:S})],{type:'application/json'}),'office-billing-backup-'+today()+'.json')}
function restoreFile(f){const r=new FileReader();r.onload=async()=>{try{const j=JSON.parse(r.result),d=j.data||j;if(!d.invoices&&!d.customers)throw 0;if(!confirm('Load this backup? It replaces everything saved here with the contents of the file.'))return;for(const k of KEYS)S[k]=d[k]||[];Object.assign(S.biz,d.biz||{});if(db){for(const k of KEYS)for(const o of S[k])await db.collection(k).doc(o.id).set(o);await db.doc('settings/biz').set(S.biz)}else saveLocal();render();note('Backup restored')}catch(e){note('That file is not a valid backup')}};r.readAsText(f)}
// ---- calculations (no tax)
const paidOf=i=>(+i.paid||0)+(i.pays||[]).reduce((s,p)=>s+p.amt,0);
const lineBase=l=>(+l.w>0&&+l.h>0)?l.w*l.h*l.qty*l.price:l.qty*l.price;
const lineAmt=l=>lineBase(l)*(1-(l.disc||0)/100);
function calc(inv){let sub=0,disc=0;for(const l of inv.lines||[]){const b=lineBase(l);sub+=b;disc+=b*(l.disc||0)/100}const total=Math.round(sub-disc);return{sub,disc,total,bal:total-paidOf(inv)}}
const status=i=>{const c=calc(i);return c.bal<=0?'paid':(paidOf(i)>0?'partial':'unpaid')};
const INV=()=>S.invoices.filter(i=>i.type!=='estimate'),EST=()=>S.invoices.filter(i=>i.type==='estimate');
const nextNo=ty=>{const m=Math.max(0,...(ty==='estimate'?EST():INV()).map(i=>+String(i.no).replace(/\D/g,'')||0));return (ty==='estimate'?'EST-':'INV-')+String(m+1).padStart(4,'0')};
const cust=id=>S.customers.find(c=>c.id===id);
const owes=id=>{const r=ledgerRows(id);return Math.max(0,r.length?r[r.length-1].b:0)};
const newLine=()=>({desc:'',qty:1,price:0,disc:0});
// ---- views
function render(){
 $('#bn').textContent=$('#bn2').textContent=S.biz.name||'Office Billing';
 $('#nav').innerHTML=NAVS.map(([k,l,ico])=>`<button class="nv ${(view===k||(view==='customer'&&k==='customers'))?'on':''}" data-act="nav" data-v="${k}">${NI[ico]}<span>${l}</span></button>`).join('');
 $('#main').innerHTML=({dashboard:vDash,invoices:vInv,customers:vCust,ledger:vLedger,customer:vLedger,items:vItems,reports:vRep,settings:vSet})[view]();
}
function vDash(){
 const mo=today().slice(0,7);let sales=0,mSales=0,recv=0;
 for(const i of INV()){const c=calc(i);sales+=c.total;if(String(i.date).startsWith(mo))mSales+=c.total}
 for(const e of S.entries){const a=+e.amount||0;sales+=a;if(String(e.date).startsWith(mo))mSales+=a}
 recv=INV().filter(i=>!cust(i.cust)).reduce((t,i)=>t+Math.max(0,calc(i).bal),0)+S.customers.reduce((t,c)=>t+owes(c.id),0);
 const owing={};for(const c of S.customers){const b=owes(c.id);if(b>0)owing[c.id]=b}
 const top=Object.entries(owing).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const rec=[...INV()].sort((a,b)=>b.date.localeCompare(a.date)||b.no.localeCompare(a.no)).slice(0,5);
 return `<div class="hero"><div><div class="k">${new Date().toDateString()}</div><h1>${esc(S.biz.name)}</h1><div class="mu">Invoices, ledgers and payments in one place.</div></div><div class="acts"><button class="btn" data-act="newinv">+ New invoice</button><button class="btn g" data-act="editcust">+ Customer</button></div></div><div class="grid"><div class="card"><div class="k">Total sales</div><div class="v">${inr(sales)}</div></div>
 <div class="card"><div class="k">This month</div><div class="v">${inr(mSales)}</div></div>
 <div class="card"><div class="k">To receive</div><div class="v unpaid">${inr(recv)}</div></div>
 <div class="card"><div class="k">Invoices</div><div class="v">${INV().length}</div></div></div>

async function hashPw(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:120000},k,256))}
const newCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(const x of crypto.getRandomValues(new Uint8Array(12)))c+=a[x%a.length];return c.match(/.{4}/g).join('-')};
async function mkUser(email,pw,role){const salt=rnd(16),code=newCode();return{u:{email:email.toLowerCase(),salt,hash:await hashPw(pw,salt),rsalt:salt,rhash:await hashPw(code.replace(/-/g,''),salt),role},code}}
const ic=p=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={mail:ic('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>'),lock:ic('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),eye:ic('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),login:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>'};
const fld=(id,type,ph,icon,eye,val='')=>`<div class="afield">${icon}<input id="${id}" type="${type}" placeholder="${ph}" value="${esc(val)}" autocomplete="${type==='password'?(id==='au-p'&&au.mode==='signin'?'current-password':'new-password'):'email'}" aria-label="${ph}">${eye?`<button class="eye" data-act="au-eye" data-t="${id}" aria-label="Show or hide password">${IC.eye}</button>`:''}</div>`;
function showAuth(mode,extra){Object.assign(au,{mode,err:'',email:''},extra||{});document.body.classList.add('locked');const m=mode,first=!users().length;
 const T={signin:['Sign in with email','Sign in to manage invoices, ledgers and payments.'],signup:['Create your office account','Set up the first login. You will be the admin.'],forgot:['Reset your password','Enter your email, your recovery code and a new password.'],code:['Save your recovery code','Keep it somewhere safe. It is the only way to reset a forgotten password.']}[m];
 let body='';
 if(m==='signin')body=fld('au-e','email','Email',IC.mail,0,au.email)+fld('au-p','password','Password',IC.lock,1)+'<div style="text-align:right;margin-bottom:8px"><button class="alink" data-act="au-mode" data-m="forgot">Forgot password?</button></div>';
 else if(m==='signup')body=fld('au-e','email','Email',IC.mail,0)+fld('au-p','password','Password (8+ characters)',IC.lock,1)+fld('au-p2','password','Confirm password',IC.lock,1);
 else if(m==='forgot')body=fld('au-e','email','Email',IC.mail,0,au.email)+fld('au-c','text','Recovery code',IC.lock,0)+fld('au-p','password','New password (8+ characters)',IC.lock,1);
 else body=`<div class="acode">${esc(au.code)}</div>`;
 const go={signin:'Get Started',signup:'Create account',forgot:'Reset password',code:'I have saved it'}[m];
 $('#auth').innerHTML=`<div class="acard"><div class="aic">${IC.login}</div><h2>${T[0]}</h2><p>${T[1]}</p>${body}<div class="aerr" id="au-err" role="alert">${esc(au.err)}</div><button class="abtn" id="au-go" data-act="au-go">${go}</button>`
 +(m==='forgot'?'<div style="margin-top:14px"><button class="alink" data-act="au-mode" data-m="signin">Back to sign in</button></div>':'')
 +(m==='signin'?`<div class="asep">Or sign in with</div><div class="asoc"><button data-act="au-social"><b style="color:#4285F4">G</b> Google</button><button data-act="au-social"><b style="color:#1877F2">f</b> Facebook</button><button data-act="au-social"><b>A</b> Apple</button></div><p class="amini">Need access? Ask your office admin to add you under Settings, Team logins.</p>`:'')+'</div>';
 setTimeout(()=>$('#au-e')?.focus(),40)}
function startSession(u){cur=u;try{localStorage.setItem(SK,JSON.stringify({e:u.email,t:Date.now()}))}catch(e){}document.body.classList.remove('locked');$('#who').innerHTML=`<div class="flex items-center gap-2"><span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-ac font-bold text-[#1b1208]">${esc(u.email[0].toUpperCase())}</span><span class="min-w-0 flex-1 truncate text-sm">${esc(u.email)}</span></div><button class="btn g s mt-2 w-full" data-act="signout">Sign out</button>`;render()}
async function authGo(){const m=au.mode,err=t=>{au.err=t;$('#au-err').textContent=t},v=id=>($('#'+id)?.value||'').trim();
 if(m==='code')return startSession(au.user);
 if(!window.crypto?.subtle)return err('This browser blocks secure login here. Open the site over https.');
 const em=v('au-e').toLowerCase(),pw=$('#au-p')?.value||'';
 if(!/^\S+@\S+\.\S+$/.test(em))return err('Enter a valid email address.');
 if(m==='signin'){if(Date.now()<lockUntil)return err('Too many attempts. Wait '+Math.ceil((lockUntil-Date.now())/1000)+' seconds.');
  const u=users().find(x=>x.email===em);if(!u||(await hashPw(pw,u.salt))!==u.hash){if(++fails>=5){lockUntil=Date.now()+30000;fails=0}return err('Wrong email or password.')}fails=0;return startSession(u)}
 if(pw.length<8)return err('Password must be at least 8 characters.');
 if(m==='signup'){if(users().length)return err('An account already exists on this browser.');if(pw!==$('#au-p2').value)return err('Passwords do not match.');const{u,code}=await mkUser(em,pw,'admin');saveUsers([u]);return showAuth('code',{code,user:u})}
 if(m==='forgot'){const us=users(),u=us.find(x=>x.email===em),c=v('au-c').replace(/[^A-Za-z0-9]/g,'').toUpperCase();if(!u||(await hashPw(c,u.rsalt))!==u.rhash)return err('Email or recovery code is not correct.');
  const{u:n,code}=await mkUser(em,pw,u.role);saveUsers(us.map(x=>x.email===em?n:x));return showAuth('code',{code,user:n})}}
const ni=p=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const NI={home:ni('<path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M10 20v-6h4v6"/>'),file:ni('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>'),users:ni('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .8 3.5 2.7 3.5 5.5"/>'),book:ni('<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 8h6"/>'),tag:ni('<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>'),chart:ni('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),gear:ni('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>')};
const NAVS=[['dashboard','Dashboard','home'],['invoices','Invoices','file'],['customers','Customers','users'],['ledger','Ledger','book'],['items','Items & rates','tag'],['reports','Reports','chart'],['settings','Settings','gear']];
function teamCard(){if(cur?.role!=='admin')return '';return `<div class="card"><b>Team logins</b><p class="mu">People who can sign in on this browser. Each new person gets a recovery code to reset their own password.</p><div class="tw"><table>${users().map(u=>`<tr><td>${esc(u.email)}</td><td class="mu">${u.role}</td><td class="r">${u.email===cur.email?'<span class="mu">you</span>':`<button class="btn d s" data-act="rmuser" data-e="${esc(u.email)}">Remove</button>`}</td></tr>`).join('')}</table></div><div class="f" style="margin-top:12px"><div><label>Staff email</label><input id="t_e" type="email"></div><div><label>Temporary password (8+ characters)</label><input id="t_p" type="text"></div></div><button class="btn" data-act="adduser">Add staff login</button></div>`}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('#auth'))$('#au-go')?.click()});
loadLocal();render();initBackup();initDb();
(()=>{let ss=null;try{ss=JSON.parse(localStorage.getItem(SK))}catch(e){}const u=ss&&users().find(x=>x.email===ss.e);if(u&&Date.now()-ss.t<30*864e5)startSession(u);else showAuth(users().length?'signin':'signup')})();
</script></body></html>
